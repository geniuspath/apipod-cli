name: release

# Runs when a version tag is pushed. Nothing here uses a long-lived publishing
# secret: signing, npm and PyPI all authenticate with this workflow's OIDC
# identity. The npm and pypi jobs wait for approval through their environments.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# No default permissions; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # cosign keyless signing and build attestations
      attestations: write  # store the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # A release build never restores a cache another run could have written.
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - run: go test -count=1 ./...
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a token that can push to geniuspath/homebrew-tap. Without
          # it the cask is written to dist/ and not pushed.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: build npm packages and wheels
        run: |
          node scripts/build-npm.mjs
          python3 scripts/build_wheels.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: npm/dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing and provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: require an npm with Trusted Publishing
        run: |
          required=11.5.1
          current="$(npm --version)"
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n 1)" != "$required" ]; then
            echo "npm $current is older than $required, which Trusted Publishing needs" >&2
            exit 1
          fi
      # upload-artifact does not keep file modes; restore the executable bit.
      - run: chmod +x npm/dist/cli-*/bin/apipod* npm/dist/apipod/bin/apipod.js
      - name: publish
        run: |
          # Platform packages first: the launcher depends on them.
          for dir in npm/dist/cli-*; do
            (cd "$dir" && npm publish --provenance --access public)
          done
          (cd npm/dist/apipod && npm publish --provenance --access public)

  pypi:
    needs: goreleaser
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: python/dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python/dist
